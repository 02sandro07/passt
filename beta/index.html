<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#F4F6F1;
  --card:#FFFFFF;
  --ink:#1E2A22;
  --muted:#5C6B60;

    --ink:#E7EEE7;
    --muted:#9AA89D;
    --line:#2C362E;
    --accent:#6FBF92;
    --accent-deep:#8FD3AF;
    --accent-ink:#0F1F16;
    --free-bg:#1E3B2B;
    --free-ink:#A5DDBC;
    --free-line:#2E5940;
    --busy-bg:#43261F;
    --busy-ink:#EBA89C;
    --busy-line:#5F352C;
    --gold:#DDB25F;
    --gold-bg:#33290F;
    --gold-line:#6E5827;
    --wa:#2BC46A;
    --wa-ink:#0E1F14;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#131A15;
  --card:#1C241E;
  --ink:#E7EEE7;
  --muted:#9AA89D;
  --line:#2C362E;
  --accent:#6FBF92;
  --accent-deep:#8FD3AF;
  --accent-ink:#0F1F16;
  --free-bg:#1E3B2B;
  --free-ink:#A5DDBC;
  --free-line:#2E5940;
  --busy-bg:#43261F;
  --busy-ink:#EBA89C;
  --busy-line:#5F352C;
  --gold:#DDB25F;
  --gold-bg:#33290F;
  --gold-line:#6E5827;
  --wa:#2BC46A;
  --wa-ink:#0E1F14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);

body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.brand{
  font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  font-weight:700;color:var(--accent);text-decoration:none;
}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 22px}
.topbar .brand{font-size:1.35rem}
.topbar a.mini{color:var(--muted);font-size:.88rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.eyebrow{
  font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0 0 4px;
}
h1{
  font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  font-weight:700;font-size:1.9rem;line-height:1.12;margin:0 0 8px;text-wrap:balance;
}
.sub{color:var(--muted);margin:0 0 20px;font-size:.97rem}
h2{
  font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  font-weight:600;font-size:1.12rem;margin:26px 0 10px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);
}
.notice{
  background:var(--gold-bg);color:var(--ink);border:1px solid var(--gold-line);
  border-radius:10px;padding:10px 12px;margin:0 0 16px;font-size:.92rem;
}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.82rem;margin:0 0 4px}
.live .dot-live{width:8px;height:8px;border-radius:50%;background:var(--wa);display:inline-block}
.people{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{

  padding:8px 14px;font-size:.95rem;font-weight:500;color:var(--ink);
  cursor:pointer;font-family:inherit;
}
.chip.me{border-color:var(--accent)}
.chip small{color:var(--muted);font-weight:400}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:12px;padding:13px 20px;font-size:1rem;font-weight:600;
  font-family:inherit;cursor:pointer;text-decoration:none;color:inherit;
}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn-wa{background:var(--wa);color:var(--wa-ink);width:100%;font-size:1.02rem}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--busy-ink);border:1px solid var(--busy-line)}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}
.btn[disabled]{opacity:.55;cursor:default}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=date]{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);font:inherit;padding:11px 12px;
}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
/* iOS: Datums-/Zeitfelder haben sonst eine eigene Mindestbreite und laufen rechts über */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input::-webkit-date-and-time-value{text-align:left;min-height:1.5em}
.field-error{color:var(--busy-ink);font-size:.88rem;margin:6px 0 0}
.hint{color:var(--muted);font-size:.92rem;margin:4px 0 12px}
.legend{display:flex;gap:14px;margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block}
.dot-free{background:var(--free-bg);border:1px solid var(--free-line)}
.dot-busy{background:var(--busy-bg);border:1px solid var(--busy-line)}

.month-head .mini{display:flex;gap:6px}
.mini button{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:8px;padding:4px 10px;font-size:.78rem;font-weight:500;
  cursor:pointer;font-family:inherit;
}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{
  text-align:center;font-size:.75rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;padding:2px 0;
}
.day{
  aspect-ratio:1/1;border-radius:10px;border:1px solid var(--free-line);
  background:var(--free-bg);color:var(--free-ink);
  font:inherit;font-weight:600;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.day.busy{
  background:var(--busy-bg);border-color:var(--busy-line);color:var(--busy-ink);
  text-decoration:line-through;font-weight:400;
}
.day.blank{visibility:hidden}
.quick{display:flex;gap:8px;margin:12px 0 0}
.quick .btn{flex:1;padding:9px 8px;font-size:.85rem;font-weight:500}
.slot{
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin:0 0 8px;box-shadow:var(--shadow);
}
.slot.perfect{border-color:var(--free-line);background:var(--free-bg)}
.slot-date{font-weight:600}
.slot.perfect .slot-date{color:var(--free-ink)}
.slot-sub{font-size:.85rem;color:var(--muted);margin-top:1px}
.slot.perfect .slot-sub{color:var(--free-ink);opacity:.85}
.pill{
  flex-shrink:0;border-radius:999px;padding:4px 11px;font-size:.85rem;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--bg);color:var(--muted);
  border:1px solid var(--line);
}
.slot.perfect .pill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{
  display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--gold);margin-left:8px;
}
details{margin-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:.92rem;padding:6px 2px}
.settings{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.92rem;
}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:1.1rem;font-weight:600;
  cursor:pointer;font-family:inherit;
}
.stepper b{min-width:118px;text-align:center;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.95rem}
.tiles{display:flex;gap:6px;margin:0 0 22px}
.tile{
  width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:.95rem;background:var(--free-bg);color:var(--free-ink);
  border:1px solid var(--free-line);font-variant-numeric:tabular-nums;
}
.tile.x{background:var(--busy-bg);color:var(--busy-ink);border-color:var(--busy-line);text-decoration:line-through;font-weight:400}
.tile.win{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mylist{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.mylist a{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
}
.mylist a b{font-weight:600}
.mylist a span{color:var(--muted);font-size:.85rem}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
.steps li{
  counter-increment:s;display:flex;gap:12px;align-items:baseline;margin:10px 0;color:var(--muted);
}
.steps li::before{
  content:counter(s);flex-shrink:0;width:26px;height:26px;border-radius:50%;
  background:var(--free-bg);color:var(--free-ink);border:1px solid var(--free-line);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:600;transform:translateY(4px);
}
.steps li b{color:var(--ink)}
.prolist{margin:10px 0;padding-left:0;list-style:none}
.prolist li{margin:8px 0;padding-left:26px;position:relative;font-size:.95rem}
.prolist li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
.footer{
  margin-top:36px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.footer a{color:var(--muted)}
.legal{text-align:center;font-size:13px;color:var(--muted);margin:22px 0 6px}
.legal a{color:var(--muted)}
.copied{color:var(--free-ink);font-size:.9rem;font-weight:600;text-align:center;min-height:1.4em;margin:6px 0 0}
.share-title{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-weight:700;font-size:1.35rem;margin:0 0 8px}
@media (prefers-reduced-motion: no-preference){
  .day,.chip,.btn{transition:background .12s,border-color .12s,color .12s}
}
/* ================== Beta-Erweiterungen ================== */
.betabar{display:flex;justify-content:center;gap:8px;font-size:.78rem;color:var(--gold);background:var(--gold-bg);
  border:1px solid var(--gold-line);border-radius:999px;padding:5px 12px;margin:0 auto 16px;width:max-content;max-width:100%;text-align:center}
.betabar a{color:var(--gold);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.04em;
  border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);background:var(--card);white-space:nowrap}
.badge.genau{color:var(--accent-deep);border-color:var(--free-line);background:var(--free-bg)}
.badge.alle{color:var(--gold);border-color:var(--gold-line);background:var(--gold-bg)}
.lock{font-size:.7rem;font-weight:700;color:var(--gold);border:1px solid var(--gold-line);background:var(--gold-bg);
  border-radius:999px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px 18px 16px;margin:4px 0 14px;box-shadow:var(--shadow)}
.hero .k{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero .when{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-weight:700;font-size:1.35rem;line-height:1.2;margin:4px 0 10px}
.hero .count{display:flex;align-items:baseline;gap:8px;margin:0 0 12px}
.hero .count b{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.hero .count span{font-size:1rem;opacity:.9}
.hero .btn{background:var(--accent-ink);color:var(--accent);width:100%;padding:11px 14px}
.hero .btn.sec{background:transparent;color:var(--accent-ink);border:1px solid currentColor;opacity:.92}
.hero .row{display:flex;gap:8px;margin-top:8px}
.hero .row .btn{flex:1}
.timeline{list-style:none;margin:6px 0 0;padding:0 0 0 14px;border-left:2px solid var(--free-line)}
.timeline li{position:relative;margin:0 0 10px;padding-left:6px}
.timeline li::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:2px solid var(--accent)}
.timeline li.now::before{background:var(--accent)}
.timeline b{font-weight:600}
.timeline span{display:block;color:var(--muted);font-size:.85rem}
.tri{display:flex;gap:6px;margin-top:8px}
.tri button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:9px;
  padding:8px 4px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.tri button.on-y{background:var(--free-bg);border-color:var(--free-line);color:var(--free-ink)}
.tri button.on-m{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.tri button.on-n{background:var(--busy-bg);border-color:var(--busy-line);color:var(--busy-ink)}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;box-shadow:var(--shadow)}
.opt.best{border-color:var(--accent)}
.opt-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.opt-head b{font-weight:600}
.opt-sub{color:var(--muted);font-size:.84rem;margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.bar i.y{background:var(--accent)} .bar i.m{background:var(--gold-line)}
.slot .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.tiers{display:flex;flex-direction:column;gap:12px;margin:8px 0 0}
.tier{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.tier.genau{border:2px solid var(--accent)}
.tier.alle{border:2px solid var(--gold-line)}
.tier h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-size:1.3rem;margin:2px 0 2px}
.tier .price{font-weight:600;color:var(--muted);font-size:.92rem}
.tier .price s{opacity:.7;margin-left:4px}
.tier .yours{float:right}
.check-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 0 8px;cursor:pointer}
.check-row input{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 6px;font:inherit;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.optrow{display:flex;gap:6px;align-items:center;margin:0 0 8px}
.dtwrap{position:relative;display:block;min-width:0}
.dtwrap input{width:100%}
@supports (-webkit-touch-callout:none){
  .dtwrap.empty::after{content:attr(data-ph);position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);opacity:.75;pointer-events:none;font-size:.95rem}
}
input::placeholder{text-transform:none}
.snack{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:.92rem;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(92vw,480px);width:max-content;text-align:center}
.optrow .dtwrap:first-child{flex:1.4}
.optrow .dtwrap:nth-child(2){flex:1}
.optrow input[type=time]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 8px}
.optrow button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;width:40px;height:44px;cursor:pointer;font-size:1.1rem}
select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:11px 12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-size:1.25rem;margin:0 0 6px}
.giftcode{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;font-weight:700;letter-spacing:.06em;text-align:center;
  background:var(--free-bg);color:var(--free-ink);border:1px dashed var(--free-line);border-radius:12px;padding:12px;margin:10px 0}
.rsvp{display:flex;gap:8px;margin-top:10px}
.rsvp .btn{flex:1;padding:10px}
.meta-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.grp{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);margin:0 0 8px}
.grp b{font-weight:600}.grp span{display:block;color:var(--muted);font-size:.84rem}
.grp a{white-space:nowrap;font-size:.86rem;font-weight:600;color:var(--accent);text-decoration:none}
</style>

<div id="app"></div>
<script>
(function(){
"use strict";

/* ================== Konfiguration ================== */
var DB_URL="https://terminfinder-5b9bf-default-rtdb.europe-west1.firebasedatabase.app";
var ROOT="passt";
var BETA=true;                       /* Beta: Käufe werden simuliert */
var FOUNDER_UNTIL="2027-03-31";
var MAX_RANGE_DAYS=370;
var TIERS={
  scho: {name:"Passt scho.", cap:8},
  genau:{name:"Passt genau.",cap:25},
  alle: {name:"Passt für alle.",cap:200}
};
var RANK={scho:0,genau:1,alle:2};
var PRODUCTS={
  passt_genau:{label:"Passt genau.",price:"4,99 €",founder:"2,99 €"},
  passt_genau_geschenk:{label:"Passt genau. als Geschenk",price:"4,99 €"},
  passt_alle_event:{label:"Passt für alle. — Event-Pass",price:"9,99 €"},
  passt_alle_verein:{label:"Passt für alle. — Verein (12 Monate)",price:"39 €"}
};

var WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
var MON=["Jän.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];
var MONL=["Jänner","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
var VLBL={y:"Ja",m:"Wenn's sein muss",n:"Nein"};

/* ================== Hilfen ================== */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(attrs[k]==null) continue;
    if(k==="text") el.textContent=attrs[k];
    else if(k==="onclick") el.addEventListener("click",attrs[k]);
    else if(k==="oninput") el.addEventListener("input",attrs[k]);
    else if(k==="onchange") el.addEventListener("change",attrs[k]);
    else el.setAttribute(k,attrs[k]);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c!=null) el.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return el;
}
function lsGet(k,fb){ try{ var v=localStorage.getItem(k); return v===null?fb:JSON.parse(v); }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return ds(new Date()); }
function parseDate(s){ var m=(s||"").split("-"); return new Date(+m[0],+m[1]-1,+m[2]); }
function daysUntil(d){ var t=parseDate(todayStr()); return Math.round((parseDate(ds(d))-t)/86400000); }
function newId(){
  var a="abcdefghjkmnpqrstuvwxyz23456789",s="";
  var r=new Uint32Array(10);
  (window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(r):r.forEach(function(_,i){r[i]=Math.random()*1e9;});
  for(var i=0;i<10;i++) s+=a[r[i]%a.length];
  return s;
}
function formatCode(id){ return (id.toUpperCase().match(/.{1,5}/g)||[id]).join("-"); }
function parseCode(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function dLong(d){ return WD[d.getDay()]+" "+d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear(); }
function dShort(d){ return WD[d.getDay()]+" "+d.getDate()+". "+MON[d.getMonth()]; }
function monthYear(s){ var d=parseDate(s); return MONL[d.getMonth()]+" "+d.getFullYear(); }
var DEVICE=lsGet("passt-device",null);
if(!DEVICE){ DEVICE="dev-"+newId(); lsSet("passt-device",DEVICE); }

/* ================== Kauf & Stufen (Gerät) ================== */
function myTier(){
  var t=lsGet("passt-tier",null);
  if(!t && lsGet("passt-pro",false)) t="genau";      /* Alt-Kauf aus v1 */
  return TIERS[t]?t:"scho";
}
function setTier(t){ if(RANK[t]>RANK[myTier()]) lsSet("passt-tier",t); }
function eventCredits(){ return lsGet("passt-event-credits",0); }
function trialUsed(){ return lsGet("passt-trial-used",false); }
function founderActive(){ return todayStr()<=FOUNDER_UNTIL; }
function genauPrice(){ return founderActive()?PRODUCTS.passt_genau.founder:PRODUCTS.passt_genau.price; }

/* ---------- Native Brücke (App-Hülle) ---------- */
var native=window.PasstNative||null;
var nativeInfo=null, pendingBuy=null;
function nativeSend(o){ try{ native.postMessage(JSON.stringify(o)); return true; }catch(e){ return false; } }
window.onPasstNative=function(msg){
  if(typeof msg==="string"){ try{msg=JSON.parse(msg);}catch(e){return;} }
  if(!msg) return;
  if(msg.cmd==="status"){ nativeInfo=msg; render(); }
  else if(msg.cmd==="bought"){ var cb=pendingBuy; pendingBuy=null; grant(msg.product,cb); }
  else if(msg.cmd==="buy-cancel"){ pendingBuy=null; }
  else if(msg.cmd==="toast"){ toast(msg.text); }
};
function isApp(){ return !!native; }

function buy(product,after){
  if(isApp()){ pendingBuy=after||null; nativeSend({cmd:"buy",product:product,beta:BETA}); return; }
  var p=PRODUCTS[product];
  var price=product==="passt_genau"?genauPrice():p.price;
  modal(function(box,close){
    box.appendChild(h("h3",{text:p.label}));
    box.appendChild(h("p",{class:"hint",style:"margin:0 0 12px",text:
      BETA?"Beta-Testkauf über "+price+" — es wird nichts berechnet. Im echten Betrieb läuft der Kauf über App Store bzw. Google Play.":
      "Käufe gibt es in der Passt.-App für iPhone und Android."}));
    box.appendChild(h("div",{class:"stack"},
      h("button",{class:"btn btn-primary",text:"Testkauf abschließen · "+price,onclick:function(){ close(); grant(product,after); }}),
      h("button",{class:"btn btn-ghost",text:"Abbrechen",onclick:close})));
  });
}
function grant(product,after){
  track("buy",product);
  if(product==="passt_genau"){ setTier("genau"); toast("Passt genau. ist freigeschaltet!"); }
  else if(product==="passt_alle_verein"){ setTier("alle"); lsSet("passt-verein-until",ds(new Date(Date.now()+365*864e5))); toast("Passt für alle. — Verein ist freigeschaltet!"); }
  else if(product==="passt_alle_event"){ lsSet("passt-event-credits",eventCredits()+1); toast("Event-Pass gutgeschrieben."); }
  else if(product==="passt_genau_geschenk"){ createGift(); return; }
  if(after) after(); else render();
}
function createGift(){
  var code=newId();
  dbPut("/p/"+code+"/gift",{tier:"genau",created:todayStr(),used:false}).then(function(){
    var mine=lsGet("passt-gifts",[]); mine.unshift({code:code,created:todayStr()}); lsSet("passt-gifts",mine.slice(0,20));
    showGift(code);
  }).catch(function(){ toast("Geschenk-Code konnte nicht erstellt werden — bitte nochmal versuchen."); });
}
function giftURL(code){ return baseURL()+"#/einloesen/"+code; }
function showGift(code){
  modal(function(box,close){
    box.appendChild(h("h3",{text:"Dein Geschenk ist bereit 🎁"}));
    box.appendChild(h("p",{class:"hint",style:"margin:0",text:"Schick den Code an die Person, die immer organisiert. Einlösen geht in der App oder auf der Website unter „Geschenk einlösen“."}));
    box.appendChild(h("div",{class:"giftcode",text:formatCode(code)}));
    var msg="🎁 Ich schenk dir Passt. genau. — weil du immer alles organisierst! Einlösen: "+giftURL(code)+" (Code "+formatCode(code)+")";
    box.appendChild(h("div",{class:"stack"},
      h("a",{class:"btn btn-wa",href:"https://wa.me/?text="+encodeURIComponent(msg),target:"_blank",rel:"noopener",text:"Per WhatsApp verschenken"}),
      h("button",{class:"btn btn-ghost",text:"Fertig",onclick:function(){close();render();}})));
  });
}

/* ---------- Modal & Toast ---------- */
function modal(build){
  var bg=h("div",{class:"modal-bg"}), box=h("div",{class:"modal",role:"dialog","aria-modal":"true"});
  function close(){ if(bg.parentNode) bg.parentNode.removeChild(bg); }
  bg.addEventListener("click",function(e){ if(e.target===bg) close(); });
  bg.appendChild(box); build(box,close); document.body.appendChild(bg);
}
var snackTimer=null;
function toast(text){
  var old=document.querySelector(".snack"); if(old) old.remove();
  var el=h("div",{class:"snack",role:"status",text:text}); document.body.appendChild(el);
  clearTimeout(snackTimer); snackTimer=setTimeout(function(){ el.remove(); },4500);
}
function dateField(type,value,attrs,onv){
  var a={type:type,value:value}; for(var k in attrs) a[k]=attrs[k];
  var inp=h("input",a);
  var w=h("span",{class:"dtwrap"+(value?"":" empty"),"data-ph":type==="date"?"Datum wählen":"Uhrzeit (optional)"},inp);
  inp.addEventListener("input",function(e){ w.classList.toggle("empty",!e.target.value); onv(e); });
  inp.addEventListener("change",function(e){ w.classList.toggle("empty",!e.target.value); });
  return w;
}

/* ================== Anmeldung (unsichtbar, anonym) ==================
   Firebase-Anonymous-Auth per REST, ohne SDK: jedes Gerät bekommt still eine
   zufällige Nutzer-ID. Die Datenbank-Regeln prüfen damit, wer einen Planer
   verwalten darf. Ohne API_KEY läuft alles wie bisher ohne Anmeldung. */
var API_KEY="AIzaSyC6rieRzoX3i_29lQXPn15rXZefgggnvio";   /* Firebase-Web-API-Schlüssel (öffentlich, kein Geheimnis) */
var LEGAL_PAGES=true;
var EMU=lsGet("passt-emu",null);   /* nur für lokale Tests mit dem Firebase-Emulator */
if(EMU){ DB_URL=EMU.db; API_KEY="emu"; }
var AUTH_HOST=EMU?EMU.auth+"/":"https://";
var AUTH=lsGet("passt-auth",null), authP=null;
function authJson(r){ return r.json().then(function(d){ if(!r.ok){ var e=new Error("auth "+r.status); e.status=r.status; throw e; } return d; }); }
function authSignUp(){
  return fetch(AUTH_HOST+"identitytoolkit.googleapis.com/v1/accounts:signUp?key="+API_KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:'{"returnSecureToken":true}'})
    .then(authJson).then(function(d){ return {uid:d.localId,tok:d.idToken,rt:d.refreshToken,exp:Date.now()+(+d.expiresIn||3600)*1000}; });
}
function authRefresh(){
  return fetch(AUTH_HOST+"securetoken.googleapis.com/v1/token?key="+API_KEY,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(AUTH.rt)})
    .then(authJson).then(function(d){ return {uid:d.user_id,tok:d.id_token,rt:d.refresh_token,exp:Date.now()+(+d.expires_in||3600)*1000}; });
}
function authValid(a){ return !!(a&&a.tok&&a.exp>Date.now()+120000); }
function authReady(){
  if(!API_KEY) return Promise.resolve(null);
  if(authValid(AUTH)) return Promise.resolve(AUTH);
  if(authP) return authP;
  var other=lsGet("passt-auth",null);          /* anderer Tab hat evtl. schon erneuert */
  if(authValid(other)){ AUTH=other; return Promise.resolve(AUTH); }
  if(other&&other.rt) AUTH=other;
  var req=(AUTH&&AUTH.rt)?authRefresh().catch(function(e){ if(e.status===400) return authSignUp(); throw e; }):authSignUp();
  authP=req.then(function(a){ AUTH=a; lsSet("passt-auth",a); authP=null; return a; },
                 function(){ authP=null; return null; });
  return authP;
}
function myUid(){ return AUTH&&AUTH.uid||null; }
authReady();   /* früh anmelden, damit beim Erstellen die ID schon da ist */

/* ================== Datenbank ================== */
function dbURL(path){
  var q=[]; if(EMU) q.push("ns="+EMU.ns);
  if(AUTH&&AUTH.tok&&AUTH.exp>Date.now()) q.push("auth="+encodeURIComponent(AUTH.tok));
  return DB_URL+"/"+ROOT+path+".json"+(q.length?"?"+q.join("&"):"");
}
function dbReq(path,opt,label){
  return authReady().then(function(){ return fetch(dbURL(path),opt); })
    .then(function(r){ if(!r.ok) throw new Error(label+" "+r.status); return r; });
}
function dbGet(path){ return dbReq(path,{cache:"no-store"},"GET").then(function(r){ return r.json(); }); }
function dbPut(path,val){ return dbReq(path,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)},"PUT").then(function(r){ return r.json(); }); }
function dbPost(path,val){ return dbReq(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)},"POST").then(function(r){ return r.json(); }); }
function dbDelete(path){ return dbReq(path,{method:"DELETE"},"DELETE").then(function(){}); }
function track(ev,data){
  var payload={ev:ev,t:todayStr(),beta:true}; if(data) payload.d=data;
  dbPost("/stats",payload).catch(function(){});
}

/* ================== Tages-Codierung ================== */
function decodeDays(str,N){
  var out=[]; if(!str||typeof str!=="string") return out;
  str.split(",").forEach(function(part){
    var m=part.split("-"), a=parseInt(m[0],10), b=m.length>1?parseInt(m[1],10):a;
    if(isNaN(a)||isNaN(b)) return;
    for(var d=Math.max(0,a); d<=Math.min(N-1,b); d++) out.push(d);
  });
  return out;
}
function encodeDays(arr){
  var a=arr.slice().sort(function(x,y){return x-y;}), parts=[], i=0;
  while(i<a.length){ var j=i; while(j+1<a.length&&a[j+1]===a[j]+1) j++; parts.push(j>i?a[i]+"-"+a[j]:String(a[i])); i=j+1; }
  return parts.join(",");
}

/* ================== Meine Planer & Gruppen (Gerät) ================== */
function myPlanners(){ return lsGet("passt-mine",[]); }
function rememberPlanner(id,title,end,extra){
  var old=myPlanners().filter(function(p){return p.id===id;})[0]||{};
  var list=myPlanners().filter(function(p){return p.id!==id;});
  var e={id:id,title:title,end:end,fixed:old.fixed||null};
  if(extra) for(var k in extra) e[k]=extra[k];
  list.unshift(e); lsSet("passt-mine",list.slice(0,30));
}
function forgetPlanner(id){ lsSet("passt-mine",myPlanners().filter(function(p){return p.id!==id;})); }
function groups(){ return lsGet("passt-groups",[]); }
function saveGroups(g){ lsSet("passt-groups",g); }
function groupById(id){ return groups().filter(function(g){return g.id===id;})[0]||null; }
function upsertGroup(g){ var all=groups().filter(function(x){return x.id!==g.id;}); all.unshift(g); saveGroups(all); }

/* ================== Router ================== */
var view={name:"home"};
function route(){
  var hs=location.hash.replace(/^#\/?/,""), q="";
  if(hs.indexOf("?")>=0){ q=hs.split("?")[1]; hs=hs.split("?")[0]; }
  stopLive(); ui.notice="";
  if(hs==="neu"){ view={name:"create"}; var g=(q.match(/g=([^&]+)/)||[])[1]; if(g) draft.group=g; render(); toTop(); }
  else if(hs==="preise"||hs==="pro"){ view={name:"preise",ctx:(q.match(/f=([^&]+)/)||[])[1]||""}; render(); toTop(); }
  else if(hs.indexOf("einloesen")===0){ view={name:"redeem",code:hs.split("/")[1]||""}; render(); toTop(); }
  else if(hs.indexOf("p/")===0){
    var parts=hs.split("/");
    if(parts[2]==="admin"&&parts[3]){ lsSet("passt-admin-"+parseCode(parts[1]),parts[3]); location.replace("#/p/"+parts[1]); return; }
    openPlanner(parts[1]);
  }
  else { view={name:"home"}; render(); toTop(); }
}
window.addEventListener("hashchange",route);

/* ================== Planer-Zustand ================== */
var P=null;
function nTermine(n){ return n+(n===1?" gemeinsamer Termin":" gemeinsame Termine"); }
var ui={mode:"list",editingName:null,draftName:"",busy:new Set(),poll:[],nameError:"",notice:"",saving:false,confirmDelete:false,live:false,copied:"",voteSel:[]};
function myNameFor(id){ return lsGet("passt-name-"+id,null); }

function buildCalendarInfo(meta){
  var start=parseDate(meta.start), end=parseDate(meta.end);
  var N=Math.round((end-start)/86400000)+1;
  function dateOf(off){ return new Date(start.getFullYear(),start.getMonth(),start.getDate()+off); }
  var months=[],off=0;
  while(off<N){
    var dt=dateOf(off), y=dt.getFullYear(), m=dt.getMonth(), from=off;
    while(off<N){ var t=dateOf(off); if(t.getMonth()!==m||t.getFullYear()!==y) break; off++; }
    months.push({y:y,m:m,fromOff:from,toOff:off-1});
  }
  return {N:N,months:months,dateOf:dateOf};
}
function planOf(m){
  if(TIERS[m.plan]) return m.plan;
  if(m.cap==="pro") return "genau";
  return "scho";
}
function applyPlanner(id,raw){
  if(!raw||!raw.meta||!raw.meta.start||!raw.meta.end){ P={id:id,missing:true}; return; }
  var m=raw.meta;
  var meta={
    title:String(m.title||"Unser Termin").slice(0,60), start:m.start, end:m.end,
    nights:(function(v){return isNaN(v)?2:Math.min(7,Math.max(0,v));})(parseInt(m.nights,10)),
    plan:planOf(m), trial:!!m.trial, owner:m.owner||null, kind:m.kind==="umfrage"?"umfrage":"fenster",
    options:Array.isArray(m.options)?m.options.slice(0,30):[],
    vote:m.vote&&Array.isArray(m.vote.opts)?m.vote:null,
    fixed:m.fixed||null, group:m.group||null, history:Array.isArray(m.history)?m.history:[],
    org:m.org?String(m.org).slice(0,60):"", admins:m.admins||null, created:m.created||"", uid:typeof m.uid==="string"?m.uid:null
  };
  meta.cap=TIERS[meta.plan].cap;
  var cal=buildCalendarInfo(meta);
  var people=[];
  if(raw.people&&typeof raw.people==="object"){
    Object.keys(raw.people).forEach(function(k){
      var p=raw.people[k]; if(!p||typeof p.name!=="string") return;
      var name=p.name.trim().slice(0,40);
      if(!name||people.some(function(q){return q.name===name;})) return;
      people.push({key:k,name:name,busy:decodeDays(p.busy,cal.N),
        poll:typeof p.poll==="string"?p.poll.split(","):[]});
    });
  }
  people.sort(function(a,b){return a.name.localeCompare(b.name,"de");});
  var votes={}; if(raw.votes&&typeof raw.votes==="object") Object.keys(raw.votes).forEach(function(k){ if(typeof raw.votes[k]==="string") votes[k]=raw.votes[k].split(","); });
  var rsvp={}; if(raw.rsvp&&typeof raw.rsvp==="object") Object.keys(raw.rsvp).forEach(function(k){ rsvp[k]=raw.rsvp[k]; });
  P={id:id,meta:meta,people:people,votes:votes,rsvp:rsvp,N:cal.N,months:cal.months,dateOf:cal.dateOf};
}
function feat(){ return RANK[P.meta.plan]>=1; }             /* Passt genau.-Funktionen */
function featAlle(){ return P.meta.plan==="alle"; }
function isAdmin(){
  if(!P||P.missing) return false;
  if(P.meta.owner||P.meta.uid){
    if(P.meta.owner===DEVICE || (P.meta.uid&&P.meta.uid===myUid())) return true;
    var tok=lsGet("passt-admin-"+P.id,null);
    return !!tok&&(tok===P.meta.admins || lsGet("passt-adminok-"+P.id,null)===tok);
  }
  return myPlanners().some(function(p){return p.id===P.id;});
}
/* Admin-Code („Passt für alle.“): liegt geheim unter passt/sec/<id>, nur der Ersteller kann ihn lesen.
   Wer den Admin-Link öffnet, hinterlegt den Code unter passt/adm/<id>/<uid> — die Regeln prüfen ihn. */
function storeAdminToken(id,tok){
  lsSet("passt-admin-"+id,tok);
  return myUid()?dbPut("/sec/"+id,tok):dbPut("/p/"+id+"/meta/admins",tok);
}
function syncAdmin(){
  if(!P||P.missing||!myUid()) return;
  var id=P.id, tok=lsGet("passt-admin-"+id,null);
  if(P.meta.uid===myUid()){
    if(!tok&&P.meta.plan==="alle") dbGet("/sec/"+id).then(function(t){ if(t){ lsSet("passt-admin-"+id,t); render(); } }).catch(function(){});
  }else if(tok&&lsGet("passt-adminok-"+id,null)!==tok){
    dbPut("/adm/"+id+"/"+myUid(),tok).then(function(){ lsSet("passt-adminok-"+id,tok); render(); }).catch(function(){});
  }
}
function meKey(){ var n=myNameFor(P.id); return n&&P.people.some(function(p){return p.name===n;})?keyFor(n):null; }

var pendingShareNew=false;
function openPlanner(id){
  id=parseCode(id);
  view={name:"planner",id:id};
  P=null; ui.mode="loading"; render(); toTop();
  dbGet("/p/"+id).then(function(raw){
    applyPlanner(id,raw);
    if(!P.missing){ rememberVisit(); syncAdmin(); }
    ui.mode=P.missing?"missing":(pendingShareNew?"share-new":"list");
    pendingShareNew=false;
    render(); startLive(id); startPolling(id);
  }).catch(function(){ ui.mode="error"; render(); });
}
function rememberVisit(){
  if(myPlanners().some(function(p){return p.id===P.id;})) rememberPlanner(P.id,P.meta.title,P.meta.end,{fixed:fixedDateStr()});
}
function refreshPlanner(){
  if(!P) return Promise.resolve();
  return dbGet("/p/"+P.id).then(function(raw){
    var keep=ui.mode; applyPlanner(P.id,raw);
    if(keep==="list"&&!P.missing) render();
  });
}

/* ================== Live ================== */
var es=null,pollTimer=null,refreshQueued=false;
function queueRefresh(){ if(refreshQueued) return; refreshQueued=true; setTimeout(function(){ refreshQueued=false; refreshPlanner().catch(function(){}); },400); }
function startLive(id){
  if(es){ es.close(); es=null; }
  authReady().then(function(){ if(es||view.name!=="planner"||view.id!==id||document.hidden) return; openStream(id); });
}
function openStream(id){
  try{
    es=new EventSource(dbURL("/p/"+id));
    es.addEventListener("auth_revoked",function(){ if(es){es.close();es=null;} if(AUTH) AUTH.exp=0; startLive(id); });
    es.addEventListener("put",function(){ ui.live=true; queueRefresh(); });
    es.addEventListener("patch",function(){ ui.live=true; queueRefresh(); });
    es.onerror=function(){ ui.live=false; if(es){es.close();es=null;}
      setTimeout(function(){ if(view.name==="planner"&&view.id===id&&!document.hidden) startLive(id); },15000); };
  }catch(e){}
}
function stopLive(){ if(es){es.close();es=null;} if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
function startPolling(id){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(function(){
    if(view.name==="planner"&&view.id===id&&ui.mode==="list"&&!document.hidden) refreshPlanner().catch(function(){});
  },5000);
}
/* Hintergrund-Tab: Live-Verbindung schließen (Firebase: max. 100 gleichzeitige Verbindungen gratis) */
document.addEventListener("visibilitychange",function(){
  if(view.name!=="planner"||!P||P.missing) return;
  if(document.hidden){ if(es){es.close();es=null;} ui.live=false; }
  else { startLive(P.id); refreshPlanner().catch(function(){}); }
});

/* ================== Fenster-Berechnung ================== */
function durLabel(n){ if(n===0) return "1 Tag"; return n+(n===1?" Nacht":" Nächte")+" · "+(n+1)+" Tage"; }
function computeSlots(){
  var len=P.meta.nights+1,out=[];
  for(var s=0;s+len-1<P.N;s++){
    var days=[]; for(var i=0;i<len;i++) days.push(s+i);
    var cant=P.people.filter(function(p){ return days.some(function(d){return p.busy.indexOf(d)>=0;}); }).map(function(p){return p.name;});
    var sat=days.some(function(d){return P.dateOf(d).getDay()===6;});
    var sun=days.some(function(d){return P.dateOf(d).getDay()===0;});
    out.push({s:s,e:s+len-1,cant:cant,can:P.people.length-cant.length,

  }

}
function fmt(off){ return dShort(P.dateOf(off)); }
function rangeTxt(s,e){ return s===e?fmt(s):fmt(s)+" – "+fmt(e); }

/* ---------- Fixierter Termin ---------- */
function fixedInfo(){
  var f=P.meta.fixed; if(!f) return null;
  if(P.meta.kind==="umfrage"){
    var o=P.meta.options[f.opt]; if(!o) return null;
    var d=parseDate(o.d); return {start:d,end:d,label:dShort(d)+" "+d.getFullYear()+(o.t?" · "+o.t+" Uhr":""),time:o.t||""};
  }
  if(typeof f.s!=="number") return null;
  var a=P.dateOf(f.s), b=P.dateOf(f.e);
  return {start:a,end:b,label:f.s===f.e?dLong(a):dShort(a)+" – "+dLong(b),time:""};
}

/* ---------- Kalender (.ics) ---------- */
function icsDate(d){ return ds(d).replace(/-/g,""); }
function buildICS(){
  var fi=fixedInfo(); if(!fi) return null;
  var lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Passt.//DE","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:"+P.id+"@passt","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"];
  if(fi.time){
    var hm=fi.time.split(":"), st=icsDate(fi.start)+"T"+hm[0]+hm[1]+"00";
    var endH=String(Math.min(23,parseInt(hm[0],10)+2)).padStart(2,"0");
    lines.push("DTSTART:"+st,"DTEND:"+icsDate(fi.start)+"T"+endH+hm[1]+"00");
  }else{
    var after=new Date(fi.end.getFullYear(),fi.end.getMonth(),fi.end.getDate()+1);
    lines.push("DTSTART;VALUE=DATE:"+icsDate(fi.start),"DTEND;VALUE=DATE:"+icsDate(after));
  }
  lines.push("SUMMARY:"+P.meta.title.replace(/[,;]/g," "),"DESCRIPTION:Gefunden mit Passt. — "+shareURL(),"END:VEVENT","END:VCALENDAR");
  return lines.join("\r\n");
}
function addToCalendar(){

  var blob=new Blob([ics],{type:"text/calendar"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=P.meta.title.replace(/[^\wäöüÄÖÜß -]/g,"")+".ics";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}

    if(days<draft.nights+1){ draft.err="Der Zeitraum ist kürzer als die gewählte Dauer."; render(); return; }

  }else{

    opts.sort(function(a,b){return (a.d+(a.t||"")).localeCompare(b.d+(b.t||""));});

  }
  if(plan==="genau"&&myTier()==="scho") meta.trial=true;
  if(plan==="alle"&&draft.org.trim()) meta.org=draft.org.trim().slice(0,60);
  var g=draft.group?groupById(draft.group):null;
  if(g&&RANK[plan]>=1){
    meta.group={id:g.id,name:g.name};
    meta.history=(g.trips||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;}).map(function(t){return {title:t.title,date:t.date};}).slice(-20);
  }
  ui.saving=true; render();
  var id=newId();
  authReady().then(function(){ if(myUid()) meta.uid=myUid(); return dbPut("/p/"+id+"/meta",meta); }).then(function(){
    return plan==="alle"?storeAdminToken(id,newId()).catch(function(){}):null;
  }).then(function(){
    ui.saving=false;
    if(meta.trial) lsSet("passt-trial-used",true);
    if(plan==="alle"&&myTier()!=="alle") lsSet("passt-event-credits",Math.max(0,eventCredits()-1));
    rememberPlanner(id,title,meta.end);
    track("create",plan+"/"+meta.kind);
    draft={title:"",start:"",end:"",nights:2,err:"",kind:"fenster",options:[{d:"",t:""},{d:"",t:""}],org:"",group:"",useEvent:false};
    pendingShareNew=true; location.hash="#/p/"+id;
  }).catch(function(){ ui.saving=false; draft.err="Erstellen hat nicht geklappt — prüfe deine Internetverbindung."; render(); });
}

function tally(list,count){
  var res=[]; for(var i=0;i<count;i++) res.push({y:[],m:[],n:[]});
  list.forEach(function(e){ e.v.forEach(function(v,i){ if(res[i]&&res[i][v]) res[i][v].push(e.name); }); });
  res.forEach(function(r){ r.score=r.y.length*2+r.m.length; });
  return res;
}

function resultsBlock(Pn,admin){
  var wrap=h("div");
  var slots=computeSlots();
  var perfect=slots.filter(function(s){return s.can===Pn;});
  var rest=slots.filter(function(s){return s.can<Pn;}).sort(function(a,b){return b.can-a.can||b.wkd-a.wkd||a.s-b.s;});
  function slotCard(sl,isPerfect){
    var left=h("div",null,
      h("div",{class:"slot-date"},rangeTxt(sl.s,sl.e),sl.fullWeekend?h("span",{class:"tag",text:"Wochenende"}):null),
      h("div",{class:"slot-sub",text:isPerfect?(Pn===1?"Passt bisher":"Da können alle "+Pn):"Nicht dabei: "+sl.cant.join(", ")}));
    var act=h("div",{class:"act"},h("span",{class:"pill",text:sl.can+"/"+Pn}));
    if(admin&&isPerfect) act.appendChild(h("button",{class:"linkbtn",onclick:function(){fixSlot({s:sl.s,e:sl.e});}},"Fixieren",feat()?null:lockTag("genau")));
    return h("div",{class:"slot"+(isPerfect?" perfect":"")},left,act);
  }
  if(perfect.length){
    var sorted=perfect.slice().sort(function(a,b){return (b.fullWeekend?1:0)-(a.fullWeekend?1:0)||a.s-b.s;});
    sorted.slice(0,6).forEach(function(sl){wrap.appendChild(slotCard(sl,true));});
    if(sorted.length>6){
      var det=h("details",null,h("summary",{text:(sorted.length-6===1?"1 weiterer Termin, der":(sorted.length-6)+" weitere Termine, die")+" für alle passt"+(sorted.length-6===1?"":"en")}));
      sorted.slice(6,56).forEach(function(sl){det.appendChild(slotCard(sl,true));});
      wrap.appendChild(det);
    }
  }else{
    wrap.appendChild(h("p",{class:"hint",text:"Kein Termin passt für alle — das sind die besten Optionen:"}));
    rest.slice(0,5).forEach(function(sl){wrap.appendChild(slotCard(sl,false));});
    rest=rest.slice(5);
  }
  if(perfect.length&&rest.length){
    var det2=h("details",null,h("summary",{text:"Termine anzeigen, die nicht für alle passen"}));
    rest.filter(function(s){return s.can>0;}).slice(0,15).forEach(function(sl){det2.appendChild(slotCard(sl,false));});
    wrap.appendChild(det2);
  }
  return wrap;
}

    box.appendChild(h("div",{class:"opt-sub",text:sub.join(" · ")||"Noch keine Antworten"}));
    box.appendChild(h("div",{class:"bar"},h("i",{class:"y",style:"width:"+(r.y.length/tot*100)+"%"}),h("i",{class:"m",style:"width:"+(r.m.length/tot*100)+"%"})));
    if(isAdmin()&&!fi) box.appendChild(h("button",{class:"linkbtn",style:"margin-top:8px",text:"Diesen Termin fixieren",onclick:function(){fixSlot({opt:i});}}));
    wrap.appendChild(box);
  });
  if(fi) app.appendChild(wrap);
}
function renderPollEdit(app){
  var card=h("div",{class:"card"});
  card.appendChild(h("label",{for:"tf-name",text:"Dein Name"}));
  card.appendChild(h("input",{type:"text",id:"tf-name",value:ui.draftName,placeholder:"z. B. Anna",autocomplete:"off",oninput:function(e){ui.draftName=e.target.value;ui.nameError="";}}));
  if(ui.nameError) card.appendChild(h("p",{class:"field-error",text:ui.nameError}));
  card.appendChild(h("p",{class:"hint",style:"margin-top:14px",text:"Wie passt dir welcher Termin?"}));
  P.meta.options.forEach(function(o,i){
    var box=h("div",{class:"opt"},h("div",{class:"opt-head"},h("b",{text:optTxt(o)})));
    var tri=h("div",{class:"tri"});
    ["y","m","n"].forEach(function(c){ tri.appendChild(h("button",{class:ui.poll[i]===c?"on-"+c:"",text:VLBL[c],onclick:function(){ui.poll[i]=c;render();}})); });
    box.appendChild(tri); card.appendChild(box);
  });
  editButtons(card);
  app.appendChild(card);
}

/* ---------- Logbuch & Gruppe ---------- */
function renderLogbook(app,fi){
  var hist=P.meta.history||[];
  if(!P.meta.group&&!hist.length) return;
  var items=hist.map(function(x){return {title:x.title,date:x.date,now:false};});
  if(fi) items.push({title:P.meta.title,date:ds(fi.start),now:true});
  if(!items.length) return;
  items.sort(function(a,b){return a.date<b.date?1:-1;});
  var n=hist.length+1;
  app.appendChild(h("h2",{text:"Logbuch"+(P.meta.group?" · "+P.meta.group.name:"")}));
  app.appendChild(h("p",{class:"hint",text:"Euer "+n+". gemeinsamer Termin"+(hist.length?" — so weit seid ihr schon gekommen:":"")}));
  var ul=h("ul",{class:"timeline"});
  items.forEach(function(it){ ul.appendChild(h("li",{class:it.now?"now":""},h("b",{text:it.title}),h("span",{text:monthYear(it.date)+(it.now?" · jetzt fix":"")}))); });
  app.appendChild(ul);
}
function addTripToGroup(gmeta,date){
  var g=groupById(gmeta.id)||{id:gmeta.id,name:gmeta.name,members:[],trips:[]};
  g.trips=(g.trips||[]).filter(function(t){return t.id!==P.id;});
  if(date) g.trips.push({id:P.id,title:P.meta.title,date:date});
  var names=P.people.map(function(p){return p.name;});
  g.members=Array.from(new Set((g.members||[]).concat(names)));
  upsertGroup(g);
}
function renderGroupSetup(app){
  var card=h("div",{class:"card"});
  card.appendChild(h("p",{class:"share-title",text:"Als Gruppe merken"}));
  card.appendChild(h("p",{class:"hint",style:"margin:0 0 12px",text:"Beim nächsten Mal: „Neuer Termin mit "+(ui.groupName||"eurer Gruppe")+"“ mit einem Tipp — und das Logbuch wächst mit jedem Trip."}));
  card.appendChild(h("label",{for:"g-name",text:"Name der Gruppe"}));
  card.appendChild(h("input",{type:"text",id:"g-name",value:ui.groupName||"",placeholder:"z. B. Stammtisch",oninput:function(e){ui.groupName=e.target.value;}}));
  card.appendChild(h("div",{class:"btn-row"},
    h("button",{class:"btn btn-ghost",text:"Abbrechen",onclick:function(){ui.mode="list";render();}}),
    h("button",{class:"btn btn-primary",text:"Merken",onclick:function(){
      var name=(ui.groupName||"").trim().slice(0,40); if(!name){ toast("Gib der Gruppe einen Namen."); return; }
      var gm={id:"g-"+newId(),name:name};
      dbPut("/p/"+P.id+"/meta/group",gm).then(refreshPlanner).then(function(){
        addTripToGroup(gm,fixedDateStr()); track("group"); ui.mode="list"; render(); toast("👥 „"+name+"“ gemerkt — zu finden auf der Startseite.");
      }).catch(function(){toast("Speichern hat nicht geklappt.");});
    }})));
  app.appendChild(card);
}

/* ---------- Werkzeuge: anstupsen, teilen, Dauer, Admin ---------- */
function renderTools(app,fi){
  var admin=isAdmin();
  if(P.meta.kind==="fenster"&&!fi){
    app.appendChild(h("div",{class:"settings"},h("span",{text:"Wie lange dauert es?"}),
      h("div",{class:"stepper"},
        h("button",{text:"−","aria-label":"Kürzer",onclick:function(){changeNights(-1);}}),
        h("b",{text:durLabel(P.meta.nights)}),
        h("button",{text:"+","aria-label":"Länger",onclick:function(){changeNights(1);}}))));
  }
  var st=h("div",{class:"stack"});
  if(!fi&&admin) st.appendChild(h("button",{class:"btn btn-ghost",onclick:nudge},"👋 Nachzügler anstupsen",feat()?null:lockTag("genau")));
  st.appendChild(h("a",{class:"btn btn-ghost",href:"https://wa.me/?text="+encodeURIComponent(shareMessage()),target:"_blank",rel:"noopener",text:"Link per WhatsApp teilen"}));
  if(admin&&!P.meta.group) st.appendChild(h("button",{class:"btn btn-ghost",onclick:function(){
    if(!feat()){ goPreise("group"); return; } ui.groupName=""; ui.mode="group-setup"; render(); toTop(); }},"👥 Als Gruppe merken",feat()?null:lockTag("genau")));
  if(admin&&featAlle()) st.appendChild(h("button",{class:"btn btn-ghost",text:"⬇︎ Als Tabelle exportieren",onclick:exportCSV}));
  if(admin&&featAlle()&&adminToken()){
    var ac=h("p",{class:"copied"});
    st.appendChild(h("button",{class:"btn btn-ghost",text:"Admin-Link kopieren",onclick:function(){copyText(adminURL(),ac);}})); st.appendChild(ac);
  }
  if(admin&&P.meta.plan==="scho"&&myTier()!=="scho") st.appendChild(h("button",{class:"btn btn-primary",text:"Diesen Planer auf "+TIERS[myTier()].name+" heben",onclick:function(){upgradePlanner(myTier());}}));
  else if(admin&&P.meta.plan!=="alle"&&eventCredits()>0) st.appendChild(h("button",{class:"btn btn-ghost",text:"Event-Pass einsetzen → Passt für alle.",onclick:function(){
    upgradePlanner("alle",function(){lsSet("passt-event-credits",Math.max(0,eventCredits()-1));}); }}));
  else if(admin&&P.meta.plan==="scho") st.appendChild(h("a",{class:"btn btn-ghost",href:"#/preise"},"Mehr mit ",h("b",{text:" Passt genau."})));
  app.appendChild(st);
}
function upgradePlanner(t,after){
  var claim=(!P.meta.uid&&myUid())?dbPut("/p/"+P.id+"/meta/uid",myUid()).then(function(){ P.meta.uid=myUid(); }):Promise.resolve();
  claim.then(function(){
    var upd=[dbPut("/p/"+P.id+"/meta/plan",t)];
    if(t==="alle"&&!adminToken()) upd.push(storeAdminToken(P.id,newId()));
    if(!P.meta.owner) upd.push(dbPut("/p/"+P.id+"/meta/owner",DEVICE));
    return Promise.all(upd);
  }).then(function(){ if(after) after(); return refreshPlanner(); }).then(function(){ track("upgrade",t); toast("Planer ist jetzt „"+TIERS[t].name+"“ — für die ganze Gruppe."); });
}
function nudge(){
  if(!feat()){ goPreise("nudge"); return; }
  var g=P.meta.group?groupById(P.meta.group.id):null;
  var inNames=P.people.map(function(p){return p.name;});
  var missing=g?(g.members||[]).filter(function(n){return inNames.indexOf(n)<0;}):[];
  var txt=missing.length?"Hey 👋 Für „"+P.meta.title+"“ fehlen noch: "+missing.join(", ")+". Tragt euch kurz ein (30 Sek.):\n"+shareURL():
    "Hey 👋 Für „"+P.meta.title+"“ sind schon "+inNames.length+" eingetragen ("+inNames.join(", ")+"). Wer fehlt noch? 30 Sek.:\n"+shareURL();
  track("nudge");
  window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
}
function exportCSV(){
  var rows=[];
  if(P.meta.kind==="umfrage"){
    rows.push(["Name"].concat(P.meta.options.map(optTxt)));
    P.people.forEach(function(p){ rows.push([p.name].concat(P.meta.options.map(function(_,i){return VLBL[p.poll[i]]||"";}))); });
  }else{
    rows.push(["Name","Tage frei","Tage ohne Zeit","Zusage"]);
    P.people.forEach(function(p){ rows.push([p.name,P.N-p.busy.length,p.busy.map(fmt).join(" / "),{y:"dabei",n:"nicht dabei"}[P.rsvp[keyFor(p.name)]]||""]); });
  }
  var csv="﻿"+rows.map(function(r){return r.map(function(c){ c=String(c); if(/^[=+\-@\t\r]/.test(c)) c="'"+c; return '"'+c.replace(/"/g,'""')+'"';}).join(";");}).join("\r\n");
  track("export");
  if(isApp()&&nativeSend({cmd:"file",name:P.meta.title+".csv",mime:"text/csv",content:csv})) return;
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=P.meta.title+".csv";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

function renderFull(app){
  var card=h("div",{class:"card"});
  card.appendChild(h("p",{class:"share-title",text:"Diese Gruppe ist voll"}));
  card.appendChild(h("p",{style:"margin:0 0 10px",text:"In diesem Planer sind schon "+P.meta.cap+" Personen — das Maximum von „"+TIERS[P.meta.plan].name+"“. Die Person, die den Planer erstellt hat, kann ihn hochstufen: Passt genau. bis 25, Passt für alle. bis 200 Personen."}));
  card.appendChild(h("div",{class:"stack"},
    h("a",{class:"btn btn-primary",href:"#/preise?f=full",text:"Stufen ansehen"}),
    h("button",{class:"btn btn-ghost",text:"Zurück",onclick:function(){ui.mode="list";render();}})));
  app.appendChild(card);
}

/* ---------- Eintragen (Zeitfenster) ---------- */
function openEditFor(name){
  ui.mode="edit"; ui.editingName=name; ui.nameError=""; ui.notice=""; ui.confirmDelete=false;
  var p=name?P.people.filter(function(x){return x.name===name;})[0]:null;
  if(p){ ui.draftName=name; ui.busy=new Set(p.busy); ui.poll=p.poll.slice(); }
  else{
    var r=myNameFor(P.id);
    ui.draftName=(r&&!P.people.some(function(q){return q.name===r;}))?r:"";
    ui.busy=new Set(); ui.poll=[];
  }
  render(); toTop();
}
function renderEdit(app){
  var card=h("div",{class:"card"});
  card.appendChild(h("label",{for:"tf-name",text:"Dein Name"}));
  card.appendChild(h("input",{type:"text",id:"tf-name",value:ui.draftName,placeholder:"z. B. Anna",autocomplete:"off",oninput:function(e){ui.draftName=e.target.value;ui.nameError="";}}));
  if(ui.nameError) card.appendChild(h("p",{class:"field-error",text:ui.nameError}));
  card.appendChild(h("p",{class:"hint",style:"margin-top:14px",text:"Tippe die Tage an, an denen du KEINE Zeit hast — sie werden rot durchgestrichen."+(P.months.length>1?" Mit den Knöpfen neben jedem Monat setzt du ganze Monate auf einmal.":"")}));
  card.appendChild(h("div",{class:"legend"},h("span",null,h("span",{class:"dot dot-free"}),"kann ich"),h("span",null,h("span",{class:"dot dot-busy"}),"kann ich nicht")));
  P.months.forEach(function(mo){
    var wrap=h("div",{class:"month"});
    var head=h("div",{class:"month-head"},h("b",{text:MONL[mo.m]+" "+mo.y}));
    if(P.months.length>1) head.appendChild(h("div",{class:"mini"},
      h("button",{text:"alles grün",onclick:function(){for(var o=mo.fromOff;o<=mo.toOff;o++) ui.busy.delete(o); paintAllDays();}}),
      h("button",{text:"alles rot",onclick:function(){for(var o=mo.fromOff;o<=mo.toOff;o++) ui.busy.add(o); paintAllDays();}})));
    wrap.appendChild(head);
    var cal=h("div",{class:"cal",role:"group","aria-label":"Kalender "+MONL[mo.m]+" "+mo.y});
    ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(function(w){cal.appendChild(h("div",{class:"cal-h",text:w}));});
    var firstDow=(P.dateOf(mo.fromOff).getDay()+6)%7;
    for(var b=0;b<firstDow;b++) cal.appendChild(h("div",{class:"day blank"}));
    for(var o=mo.fromOff;o<=mo.toOff;o++)(function(o){
      var el=h("button",{class:"day","data-off":String(o),onclick:function(ev){ if(ui.busy.has(o)) ui.busy.delete(o); else ui.busy.add(o); paintDay(ev.currentTarget,o); }},String(P.dateOf(o).getDate()));
      paintDay(el,o); cal.appendChild(el);
    })(o);
    wrap.appendChild(cal); card.appendChild(wrap);
  });
  card.appendChild(h("div",{class:"quick"},
    h("button",{class:"btn btn-ghost",text:"Alles auf grün",onclick:function(){ui.busy=new Set();paintAllDays();}}),
    h("button",{class:"btn btn-ghost",text:"Alles auf rot",onclick:function(){ui.busy=new Set();for(var i=0;i<P.N;i++)ui.busy.add(i);paintAllDays();}})));
  editButtons(card);
  app.appendChild(card);
}
function editButtons(card){
  var save=h("button",{class:"btn btn-primary",text:ui.saving?"Wird gespeichert …":"Speichern",onclick:onSaveEntry});
  var cancel=h("button",{class:"btn btn-ghost",text:"Abbrechen",onclick:function(){ui.mode="list";render();}});
  if(ui.saving){save.disabled=true;cancel.disabled=true;}
  card.appendChild(h("div",{class:"btn-row"},cancel,save));
  if(ui.editingName){
    var del=h("button",{class:"btn btn-danger",style:"width:100%;margin-top:10px",text:ui.confirmDelete?"Wirklich löschen?":"Meinen Eintrag löschen",onclick:function(){
      if(!ui.confirmDelete){ui.confirmDelete=true;render();return;}
      var p=P.people.filter(function(x){return x.name===ui.editingName;})[0];
      if(!p){ui.mode="list";render();return;}
      ui.saving=true; render();
      Promise.all([dbDelete("/p/"+P.id+"/people/"+p.key),dbDelete("/p/"+P.id+"/votes/"+p.key),dbDelete("/p/"+P.id+"/rsvp/"+p.key)])
        .then(refreshPlanner).then(function(){ ui.saving=false; ui.mode="list"; ui.notice="Eintrag gelöscht."; render(); toTop(); })
        .catch(function(){ ui.saving=false; ui.nameError="Löschen hat nicht geklappt — bitte nochmal versuchen."; render(); });
    }});
    if(ui.saving) del.disabled=true;
    card.appendChild(del);
  }
}
function paintDay(el,o){
  var busy=ui.busy.has(o), dt=P.dateOf(o);
  el.className="day"+(busy?" busy":"");
  el.setAttribute("aria-pressed",busy?"true":"false");
  el.setAttribute("aria-label",dt.getDate()+". "+MONL[dt.getMonth()]+", "+(busy?"keine Zeit":"Zeit"));
}
function paintAllDays(){ document.querySelectorAll(".day[data-off]").forEach(function(el){ paintDay(el,parseInt(el.getAttribute("data-off"),10)); }); }
function keyFor(name){ return encodeURIComponent(name).replace(/\./g,"%2E"); }

function onSaveEntry(){
  var name=ui.draftName.trim().slice(0,40);
  if(!name){ ui.nameError="Bitte gib zuerst deinen Namen ein."; render(); return; }
  if(P.people.some(function(p){return p.name===name&&p.name!==ui.editingName;})){
    ui.nameError="Diesen Namen gibt es schon. Wenn du das bist: geh zurück und tippe auf deinen Namen. Sonst nimm z. B. „"+name+" B.“"; render(); return;
  }
  if(!ui.editingName&&P.people.length>=P.meta.cap){ ui.mode="full"; render(); return; }
  var rec={name:name};
  if(P.meta.kind==="umfrage"){
    var ans=P.meta.options.map(function(_,i){return ui.poll[i]||"n";});
    rec.poll=ans.join(",");
  }else rec.busy=encodeDays(Array.from(ui.busy));
  ui.saving=true; render();
  var work=Promise.resolve();
  if(ui.editingName&&ui.editingName!==name){
    var old=P.people.filter(function(x){return x.name===ui.editingName;})[0];
    if(old) work=dbDelete("/p/"+P.id+"/people/"+old.key).catch(function(){});
  }
  work.then(function(){ return dbPut("/p/"+P.id+"/people/"+keyFor(name),rec); }).then(function(){
    lsSet("passt-name-"+P.id,name);
    if(!ui.editingName) track("join");
    return refreshPlanner();
  }).then(function(){
    ui.saving=false; ui.mode="list"; render(); toTop();
    toast("Gespeichert! Alle anderen sehen deine Auswahl automatisch.");
  }).catch(function(){ ui.saving=false; ui.nameError="Speichern hat nicht geklappt — prüfe deine Internetverbindung."; render(); });
}
function changeNights(delta){
  var n=P.meta.nights+delta; if(n<0||n>7) return;
  dbPut("/p/"+P.id+"/meta/nights",n).then(refreshPlanner).then(render).catch(function(){ toast("Ändern hat nicht geklappt — bitte nochmal versuchen."); });
}

/* ================== Start ================== */
if(native) nativeSend({cmd:"hello"});
route();
})();
</script>
